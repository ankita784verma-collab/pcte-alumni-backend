<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Manage Alumni Directory</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill text-danger fs-3 me-2"></i>
        <span>PCTE <span class="text-danger">Admin Portal</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="directory.html" class="btn btn-nav-outline btn-sm">View Public Directory</a>
        <a href="dashboard-admin.html" class="btn btn-danger btn-sm rounded-pill px-3">Control Center</a>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="bg-white py-4 border-bottom">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
      <div>
        <span class="badge badge-pill-light mb-1"><i class="bi bi-shield-lock-fill me-1"></i> Management Console</span>
        <h2 class="fw-bold mb-0">Alumni Directory Control</h2>
      </div>
      <!-- Add Alumni Button (Triggers Modal) -->
      <button class="btn btn-nav-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#addAlumniModal" onclick="openAddModal()">
        <i class="bi bi-person-plus-fill me-2"></i> Add New Alumnus
      </button>
    </div>
  </header>

  <!-- Admin Data Table Section -->
  <main class="flex-grow-1 py-5">
    <div class="container">
      <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th class="ps-4">Profile</th>
                  <th>Name</th>
                  <th>Role &amp; Company</th>
                  <th>Batch / Program</th>
                  <th class="text-end pe-4">Actions</th>
                </tr>
              </thead>
              <tbody id="alumniTableBody">
                <!-- Dynamically Rendered Rows -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Add / Edit Alumni -->
  <div class="modal fade" id="addAlumniModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow-lg p-3">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="fw-bold mb-0" id="modalTitle">Add New Alumnus</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="alumniForm">
            <input type="hidden" id="alumniId">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Full Name *</label>
              <input type="text" id="alumniName" class="form-control" placeholder="Ex: Rahul Sharma" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Job Title &amp; Company *</label>
              <input type="text" id="alumniRole" class="form-control" placeholder="Ex: Software Architect at TechCorp" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Batch &amp; Degree *</label>
              <input type="text" id="alumniBatch" class="form-control" placeholder="Ex: Batch 2018 · B.Tech CSE" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Photo URL (Optional)</label>
              <input type="url" id="alumniPhoto" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-nav-primary rounded-pill px-4">Save Entry</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container text-center text-white-50 small">
      &copy; 2026 PCTE Alumni Talks. All rights reserved.
    </div>
  </footer>

  <!-- JavaScript CRUD Logic -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    if (!API.requireLogin(true)) throw new Error('Admin login required');
    let alumniList = [];

    async function loadAlumni() {
      const tbody = document.getElementById('alumniTableBody');
      try { alumniList = await API.getAlumni(); renderTable(); }
      catch (err) { tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">${esc(err.message)}</td></tr>`; }
    }

    function renderTable() {
      const tbody = document.getElementById('alumniTableBody');
      tbody.innerHTML = '';
      if (alumniList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No alumni profiles found.</td></tr>`;
        return;
      }
      alumniList.forEach(item => {
        const photo = esc(item.photo) || `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=dc3545&color=fff`;
        tbody.innerHTML += `
          <tr>
            <td class="ps-4"><img src="${photo}" class="rounded-circle shadow-sm" width="45" height="45" style="object-fit: cover;"></td>
            <td class="fw-bold">${esc(item.name)}</td>
            <td class="text-danger small fw-semibold">${esc(item.role)}</td>
            <td><span class="badge badge-pill-light">${esc(item.batch)}</span></td>
            <td class="text-end pe-4">
              <button class="btn btn-outline-dark btn-sm rounded-circle me-1" onclick="editAlumni(${item.id})" title="Edit"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger btn-sm rounded-circle" onclick="deleteAlumni(${item.id})" title="Delete"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`;
      });
    }

    function openAddModal() {
      document.getElementById('alumniForm').reset();
      document.getElementById('alumniId').value = '';
      document.getElementById('modalTitle').innerText = 'Add New Alumnus';
    }

    document.getElementById('alumniForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const id = document.getElementById('alumniId').value;
      const entry = {
        name: document.getElementById('alumniName').value.trim(),
        role: document.getElementById('alumniRole').value.trim(),
        batch: document.getElementById('alumniBatch').value.trim(),
        photo: document.getElementById('alumniPhoto').value.trim()
      };
      try {
        if (id) await API.updateAlumnus(id, entry); else await API.addAlumnus(entry);
        bootstrap.Modal.getInstance(document.getElementById('addAlumniModal')).hide();
        this.reset();
        await loadAlumni();
      } catch (err) { alert(err.message); }
    });

    async function deleteAlumni(id) {
      if (!confirm("Are you sure you want to delete this alumnus from the directory?")) return;
      try { await API.deleteAlumnus(id); await loadAlumni(); } catch (err) { alert(err.message); }
    }

    function editAlumni(id) {
      const item = alumniList.find(a => a.id === id);
      if (!item) return;
      document.getElementById('alumniId').value = item.id;
      document.getElementById('alumniName').value = item.name;
      document.getElementById('alumniRole').value = item.role;
      document.getElementById('alumniBatch').value = item.batch;
      document.getElementById('alumniPhoto').value = item.photo || '';
      document.getElementById('modalTitle').innerText = 'Edit Alumnus Details';
      new bootstrap.Modal(document.getElementById('addAlumniModal')).show();
    }

    loadAlumni();
  </script>
</body>
</html>
