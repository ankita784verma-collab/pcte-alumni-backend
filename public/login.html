<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PCTE Alumni Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Unified Enterprise Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill text-danger fs-3 me-2"></i>
        <span>PCTE <span class="text-danger">Alumni Talks</span></span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-nav-outline btn-sm px-3">Home</a>
        <a href="register.html" class="btn btn-nav-primary btn-sm px-3">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Card Centered -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
            <div class="text-center mb-4">
              <span class="badge badge-pill-light mb-2">Secure Portal</span>
              <h3 class="fw-bold mb-1">Welcome Back</h3>
              <p class="text-muted small">Enter your credentials to access your alumni dashboard.</p>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" id="loginEmail" class="form-control bg-light border-start-0" placeholder="name@pcte.edu.in" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" id="loginPassword" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" class="btn btn-nav-primary w-100 py-3 mb-3 fs-6 fw-semibold shadow-sm">Sign In to Dashboard</button>
            </form>

            <p class="text-center small text-muted mb-0">
              Don't have an account? <a href="register.html" class="text-danger fw-semibold text-decoration-none">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Professional Footer -->
  <footer class="py-3 text-center bg-dark text-white-50 small mt-auto border-top border-danger">
    <div class="container">
      &copy; 2026 PCTE Alumni Talks. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type="submit"]');
      const label = btn.innerHTML;
      btn.disabled = true; btn.innerText = 'Signing in...';
      try {
        const user = await API.login(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
        window.location.href = String(user.role).toLowerCase() === 'admin' ? 'dashboard-admin.html' : 'dashboard.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false; btn.innerHTML = label;
      }
    });
  </script>
</body>
</html>
