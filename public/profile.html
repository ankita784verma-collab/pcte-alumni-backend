<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - PCTE Alumni Talks</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill text-danger fs-3 me-2"></i>
        <span>PCTE <span class="text-danger">Alumni Portal</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Back to Dashboard</a>
      </div>
    </div>
  </nav>

  <!-- Profile Edit Section -->
  <main class="flex-grow-1 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm border-0 p-4 p-md-5 rounded-4 bg-white">
            <div class="d-flex align-items-center mb-4">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop"
                class="rounded-circle me-3 shadow-sm border border-danger-subtle p-1" width="80" height="80"
                alt="Profile Picture" style="object-fit: cover;">
              <div>
                <h2 class="fw-bold h4 mb-1">Edit Profile Settings</h2>
                <p class="text-muted small mb-0">Keep your professional information updated for the public directory and
                  mentoring network.</p>
              </div>
            </div>

            <form id="profileForm">
              <div class="row g-3">

                <div class="col-md-6">
                  <label for="profileName" class="form-label small fw-semibold">Full Name *</label>
                  <input type="text" class="form-control" id="profileName" value="Rahul Sharma" required>
                </div>

                <div class="col-md-6">
                  <label for="profileEmail" class="form-label small fw-semibold">Email Address *</label>
                  <input type="email" class="form-control" id="profileEmail" value="rahul.sharma@example.com" required>
                </div>

                <div class="col-md-6">
                  <label for="profileBatch" class="form-label small fw-semibold">Batch &amp; Course *</label>
                  <input type="text" class="form-control" id="profileBatch" value="Batch 2018 · B.Tech CSE" required>
                </div>

                <div class="col-md-6">
                  <label for="profileTitle" class="form-label small fw-semibold">Current Job Title &amp; Company
                    *</label>
                  <input type="text" class="form-control" id="profileTitle" value="Software Architect at TechCorp"
                    required>
                </div>

                <div class="col-12">
                  <label for="profileBio" class="form-label small fw-semibold">Professional Bio</label>
                  <textarea class="form-control" id="profileBio"
                    rows="3">Passionate about cloud architecture, artificial intelligence, and mentoring aspiring tech graduates.</textarea>
                </div>

              </div>

              <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="dashboard.html" class="btn btn-light rounded-pill px-4">Cancel</a>
                <button type="submit" class="btn btn-nav-primary rounded-pill px-4">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container text-center text-white-50 small">
      &copy; 2026 PCTE Alumni Talks. All rights reserved.
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('profileForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert("Profile updated successfully!");
      window.location.href = "dashboard.html";
    });
  </script>
</body>

</html>
