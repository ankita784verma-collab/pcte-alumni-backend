<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PCTE Alumni Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Unified Enterprise Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill text-danger fs-3 me-2"></i>
        <span>PCTE <span class="text-danger">Alumni Talks</span></span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-nav-outline btn-sm px-3">Home</a>
        <a href="login.html" class="btn btn-nav-primary btn-sm px-3">Login</a>
      </div>
    </div>
  </nav>

  <!-- Register Card Centered -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
            <div class="text-center mb-4">
              <span class="badge badge-pill-light mb-2">Join the Network</span>
              <h3 class="fw-bold mb-1">Create an Account</h3>
              <p class="text-muted small">Connect with alumni, register for talks, and build your professional network.</p>
            </div>

            <!-- Error Banner -->
            <div id="registerAlert" class="alert alert-danger d-none small py-2 px-3 rounded-3" role="alert"></div>

            <form id="registerForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Full Name *</label>
                  <input type="text" id="regName" class="form-control" placeholder="Ankita" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Email Address *</label>
                  <input type="email" id="regEmail" class="form-control" placeholder="name@pcte.edu.in" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Role *</label>
                  <select id="regRole" class="form-select">
                    <option value="Student / Alumnus">Student / Alumnus</option>
                    <option value="Admin">Administrator</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Password *</label>
                  <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Batch / Degree</label>
                  <input type="text" id="regBatch" class="form-control" placeholder="Batch 2026 · B.Tech CSE">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Job Title / Program</label>
                  <input type="text" id="regJob" class="form-control" placeholder="Student / Developer">
                </div>
              </div>

              <button type="submit" id="regSubmitBtn" class="btn btn-nav-primary w-100 py-3 mt-4 fs-6 fw-semibold shadow-sm">
                Complete Registration
              </button>
            </form>

            <p class="text-center small text-muted mt-4 mb-0">
              Already have an account? <a href="login.html" class="text-danger fw-semibold text-decoration-none">Sign in here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Professional Footer -->
  <footer class="py-3 text-center bg-dark text-white-50 small mt-auto border-top border-danger">
    <div class="container">
      &copy; 2026 PCTE Alumni Talks. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const role = document.getElementById('regRole').value;
      const password = document.getElementById('regPassword').value;
      const batch_program = document.getElementById('regBatch').value.trim();
      const job_title = document.getElementById('regJob').value.trim();

      const btn = document.getElementById('regSubmitBtn');
      const alertBox = document.getElementById('registerAlert');

      alertBox.classList.add('d-none');
      alertBox.innerText = '';
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status"></span>Creating account...`;

      try {
        const res = await API.register({ name, email, password, role, batch_program, job_title });
        const user = res.user || API.getCurrentUser();
        const isAdmin = user && user.role === 'Admin';
        window.location.href = isAdmin ? "dashboard-admin.html" : "dashboard.html";
      } catch (err) {
        alertBox.innerText = err.message || 'Registration failed. Please check your details and try again.';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = `Complete Registration`;
      }
    });
  </script>
</body>
</html>
